[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevzilla"
version = "0.1.0"
description = "A tiny, fearless client for the JEV evaluation API"
requires-python = ">=3.8"
dependencies = ["requests>=2.28"]

[tool.setuptools]
packages = ["jevzilla"]
